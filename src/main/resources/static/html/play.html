<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Играть - Кроссворды</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🎮 Выбор кроссворда</div>
        <button id="back-btn" class="btn btn-secondary">← Назад</button>
    </nav>
    
    <div class="crossword-selection-container">
        <div class="selection-header">
            <h1>Выберите кроссворд для игры</h1>
        </div>
        
        <div id="crosswords-list" class="crosswords-grid">
            <!-- Кроссворды будут загружены динамически -->
        </div>
        
        <div id="no-crosswords-message" class="no-items-message" style="display: none;">
            <p>Нет доступных кроссвордов</p>
            <p style="color: var(--text-secondary); font-size: 14px;">Создайте кроссворд в разделе "Создать кроссворд"</p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Проверяем авторизацию
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // Кнопка назад
        document.getElementById('back-btn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Загрузка и отображение кроссвордов
        async function loadCrosswords() {
            try {
                const crosswords = await ApiService.getCrosswords();
                await renderCrosswords(crosswords);
            } catch (error) {
                console.error('Ошибка загрузки кроссвордов:', error);
                document.getElementById('no-crosswords-message').style.display = 'block';
            }
        }

        async function renderCrosswords(crosswords) {
            const listContainer = document.getElementById('crosswords-list');
            const noMessage = document.getElementById('no-crosswords-message');

            if (crosswords.length === 0) {
                listContainer.style.display = 'none';
                noMessage.style.display = 'block';
                return;
            }

            listContainer.style.display = 'grid';
            noMessage.style.display = 'none';
            listContainer.innerHTML = '';

            const userId = currentUser.id;

            // Загружаем игры пользователя для расчета оставшихся подсказок
            let userGames = [];
            try {
                userGames = await ApiService.getUserGames(userId);
            } catch (error) {
                console.error('Ошибка загрузки игр пользователя:', error);
            }
            
            // Создаем Map: crosswordId -> { hintsUsed, gridState, gameOver, solvedWordsCount }
            const userGameMap = new Map();
            userGames.forEach(game => {
                const crosswordId = Number(game.crosswordId);
                // Берем последнюю (или активную) игру для этого кроссворда
                const existingGame = userGameMap.get(crosswordId);
                if (!existingGame || !existingGame.gameOver) {
                    userGameMap.set(crosswordId, {
                        hintsUsed: game.hintsUsed || 0,
                        gridState: game.gridState || null,
                        gameOver: game.gameOver || false,
                        solvedWordsCount: game.solvedWordsCount || 0
                    });
                }
            });

            // Загружаем детали кроссвордов для расчета процента
            const detailsPromises = crosswords.map(async (crossword) => {
                try {
                    const detail = await ApiService.getCrosswordDetail(crossword.id);
                    return { crosswordId: crossword.id, detail };
                } catch (error) {
                    return { crosswordId: crossword.id, detail: null };
                }
            });

            const allDetails = await Promise.all(detailsPromises);
            const detailsMap = new Map(allDetails.map(d => [d.crosswordId, d.detail]));

            crosswords.forEach(crossword => {
                const card = document.createElement('div');
                card.className = 'crossword-card';
                
                const title = document.createElement('h3');
                title.textContent = crossword.title || 'Без названия';
                
                const info = document.createElement('div');
                info.className = 'crossword-info';
                
                const gridSize = document.createElement('span');
                gridSize.className = 'info-item';
                gridSize.innerHTML = `<strong>Размер:</strong> ${crossword.gridWidth || 'N/A'} × ${crossword.gridHeight || 'N/A'}`;
                
                const dictionaryInfo = document.createElement('span');
                dictionaryInfo.className = 'info-item';
                dictionaryInfo.innerHTML = `<strong>Словарь:</strong> ${crossword.dictionary?.title || 'N/A'}`;
                
                const crosswordIdNum = Number(crossword.id);
                const userGame = userGameMap.get(crosswordIdNum);
                const detail = detailsMap.get(crossword.id);
                
                // Оставшиеся подсказки
                const hintsInfo = document.createElement('span');
                hintsInfo.className = 'info-item';
                const maxHints = crossword.maxHints !== null && crossword.maxHints !== undefined ? crossword.maxHints : 0;
                const hintsUsed = userGame ? userGame.hintsUsed : 0;
                const remainingHints = Math.max(0, maxHints - hintsUsed);
                hintsInfo.innerHTML = `<strong>Подсказок осталось:</strong> ${remainingHints}`;
                
                // Информация о создателе
                const creatorInfo = document.createElement('span');
                creatorInfo.className = 'info-item';
                const creatorName = crossword.createdByUserLogin || 'Неизвестен';
                creatorInfo.innerHTML = `<strong>Создатель:</strong> ${creatorName}`;
                
                // Процент выполнения (на основе данных игры пользователя)
                const completionInfo = document.createElement('span');
                completionInfo.className = 'info-item';
                let completionText = '0%';
                
                if (detail && detail.gridData && detail.gridData.cells) {
                    const totalLetters = detail.gridData.cells.filter(cell => !cell.isBlack).length;
                    let guessedLetters = 0;
                    
                    // Считаем буквы из gridState пользователя
                    if (userGame && userGame.gridState) {
                        try {
                            const gridState = JSON.parse(userGame.gridState);
                            if (Array.isArray(gridState)) {
                                guessedLetters = gridState.filter(cell => cell.isLocked).length;
                            }
                        } catch (e) {
                            console.error('Ошибка парсинга gridState:', e);
                        }
                    }
                    
                    // Если игра завершена, показываем 100%
                    if (userGame && userGame.gameOver) {
                        completionText = '100%';
                    } else {
                        const completionPercentage = totalLetters > 0 
                            ? Math.min(100, (guessedLetters / totalLetters) * 100).toFixed(1)
                            : '0';
                        completionText = `${completionPercentage}%`;
                    }
                }
                completionInfo.innerHTML = `<strong>Выполнено:</strong> ${completionText}`;
                
                info.appendChild(gridSize);
                info.appendChild(dictionaryInfo);
                info.appendChild(hintsInfo);
                info.appendChild(creatorInfo);
                info.appendChild(completionInfo);
                
                const actions = document.createElement('div');
                actions.className = 'crossword-actions';
                
                const playBtn = document.createElement('button');
                playBtn.className = 'btn btn-primary';
                playBtn.textContent = '🎮 Играть';
                playBtn.style.width = '100%';
                playBtn.addEventListener('click', () => {
                    window.location.href = `game.html?crosswordId=${crossword.id}`;
                });
                
                actions.appendChild(playBtn);
                
                card.appendChild(title);
                card.appendChild(info);
                card.appendChild(actions);
                
                listContainer.appendChild(card);
            });
        }

        // Загружаем кроссворды при загрузке страницы
        loadCrosswords();
    </script>
</body>
</html>
