<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Кроссворды</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🎯 Кроссворды</h1>
            <p>Создайте аккаунт</p>
        </div>
        
        <div class="auth-form">
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="register-username">Логин</label>
                    <input type="text" id="register-username" class="form-control" 
                           required minlength="4" maxlength="8"
                           placeholder="4-8 символов">
                    <div class="field-hint">От 4 до 8 символов</div>
                    <div class="field-error" id="login-error"></div>
                </div>
                <div class="form-group">
                    <label for="register-password">Пароль</label>
                    <input type="password" id="register-password" class="form-control" 
                           required minlength="4" maxlength="12"
                           placeholder="4-12 символов">
                    <div class="field-hint">От 4 до 12 символов</div>
                    <div class="field-error" id="password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
            </form>
            <div id="form-error" class="error-message"></div>
            
            <div class="auth-switch">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Константы валидации
        const VALIDATION = {
            LOGIN_MIN: 4,
            LOGIN_MAX: 8,
            PASSWORD_MIN: 4,
            PASSWORD_MAX: 12
        };

        // Проверяем, авторизован ли пользователь
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            const user = JSON.parse(currentUser);
            if (user.isAdmin === true) {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        }

        // Функция валидации поля
        function validateField(input, errorDiv, minLen, maxLen, fieldName) {
            const value = input.value.trim();
            
            if (!value) {
                errorDiv.textContent = `${fieldName} обязателен`;
                input.classList.add('invalid');
                return false;
            }
            
            if (value.length < minLen) {
                errorDiv.textContent = `${fieldName} должен содержать минимум ${minLen} символов`;
                input.classList.add('invalid');
                return false;
            }
            
            if (value.length > maxLen) {
                errorDiv.textContent = `${fieldName} должен содержать максимум ${maxLen} символов`;
                input.classList.add('invalid');
                return false;
            }
            
            errorDiv.textContent = '';
            input.classList.remove('invalid');
            return true;
        }

        // Поля формы
        const loginInput = document.getElementById('register-username');
        const passwordInput = document.getElementById('register-password');
        const loginError = document.getElementById('login-error');
        const passwordError = document.getElementById('password-error');
        const formError = document.getElementById('form-error');

        // Валидация в реальном времени
        loginInput.addEventListener('input', () => {
            validateField(loginInput, loginError, VALIDATION.LOGIN_MIN, VALIDATION.LOGIN_MAX, 'Логин');
        });

        passwordInput.addEventListener('input', () => {
            validateField(passwordInput, passwordError, VALIDATION.PASSWORD_MIN, VALIDATION.PASSWORD_MAX, 'Пароль');
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            formError.style.display = 'none';
            
            // Валидация перед отправкой
            const isLoginValid = validateField(loginInput, loginError, VALIDATION.LOGIN_MIN, VALIDATION.LOGIN_MAX, 'Логин');
            const isPasswordValid = validateField(passwordInput, passwordError, VALIDATION.PASSWORD_MIN, VALIDATION.PASSWORD_MAX, 'Пароль');
            
            if (!isLoginValid || !isPasswordValid) {
                return;
            }
            
            const login = loginInput.value.trim();
            const password = passwordInput.value;

            try {
                const user = await ApiService.register(login, password);
                localStorage.setItem('currentUser', JSON.stringify(user));
                // Новые пользователи всегда не-админы, переходим на обычную панель
                window.location.href = 'user-dashboard.html';
            } catch (error) {
                formError.textContent = error.message || 'Ошибка регистрации';
                formError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
