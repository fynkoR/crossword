<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Кроссворды</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🎯 Кроссворды</h1>
            <p>Создайте аккаунт</p>
        </div>
        
        <div class="auth-form">
            <form id="registerForm">
                <div class="form-group">
                    <label for="register-username">Логин</label>
                    <input type="text" id="register-username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Пароль</label>
                    <input type="password" id="register-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
            </form>
            <div id="register-error" class="error-message"></div>
            
            <div class="auth-switch">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Проверяем, авторизован ли пользователь
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            const user = JSON.parse(currentUser);
            if (user.isAdmin === true) {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('register-error');
            errorDiv.style.display = 'none';
            
            const login = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;

            try {
                const user = await ApiService.register(login, password);
                localStorage.setItem('currentUser', JSON.stringify(user));
                // Новые пользователи всегда не-админы, переходим на обычную панель
                window.location.href = 'user-dashboard.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Ошибка регистрации';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
